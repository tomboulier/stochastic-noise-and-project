name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: uv sync --locked
      - name: Self-checks (tiny random U-Net, CPU)
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            uv run python "$t"
            echo "::endgroup::"
          done

  code-archive:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the anonymized code archive
        env:
          # repository secret; empty on pull requests from forks (names are then not checked)
          ANONYMITY_PATTERNS: ${{ secrets.ANONYMITY_PATTERNS }}
        run: scripts/build_supplement.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snap_code
          path: dist/snap_code.zip
